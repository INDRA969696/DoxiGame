<html>
  <head>
    <title>DoxiGame</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" type="text/css" href="main.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f0f0f0;
        font-family: Arial, sans-serif;
      }
      .top-bar-frame {
        width: 100%;
        height: 60px;
        background-color: #00A1FF;
        position: fixed;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .top-dropdown-ui {
        display: block;
        position: absolute;
        width: 40%;
        height: 250px;
        top: 60px;
        right: 10px;
        background-color: #00A0FF;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!-- top layer -->
     <div class="top-bar-frame">
      <img src="icon.png" alt="DoxiGame Icon" style="height: 100%; margin-right: 10px; position: absolute; left: 5px;">
      <h1 style="margin: 0; font-size: 28px; position: absolute; left: 70px; text-shadow: 2px 4px 6px rgba(0, 0, 0, 0.5);">DoxiGame</h1>
      <button class="fa-sharp fa-solid fa-bars-staggered" style="background: none; border: none; color: white; font-size: 24px; cursor: pointer; position: absolute; right: 15px;"></button>
     </div>
     <div class="top-dropdown-ui">
       
     </div>
  </body>
</html>
