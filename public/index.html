<html>
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Playwrite+NZ+Basic:wght@100..400&family=Sekuya&display=swap" rel="stylesheet">
    <title>DoxiGame</title>
    <link rel="icon" type="image/png" href="asset/icon.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="CSS/main.css">
    <link rel="stylesheet" href="CSS/startPage.css">
    <link rel="stylesheet" href="CSS/homePage.css">
    <link rel="stylesheet" href="CSS/gamePage.css">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f0f0f0;
        font-family: "Sekuya", system-ui;
      }
      .top-bar-frame {
        width: 100%;
        height: 60px;
        top: 0;
        background-color: #00A1FF;
        position: fixed;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      .top-dropdown-btn {
        font-size: 16px;
        text-align: left;
        height: 50px;
        width: 100%;
        padding: 10px;
        border: 1px solid #0090f0;
        background: none;
        color: #fff;
        background-color: #00A0F4;
        cursor: pointer;
        z-index: 999;
      }
      .top-dropdown-btn:hover {
        background-color: #0090f0;
      }
    </style>
  </head>
  <body>
    <!-- top layer -->
     <div class="top-bar-frame">
      <img src="asset/icon.png" alt="DoxiGame Icon" style="height: 100%; margin-right: 10px; position: absolute; left: 5px;">
      <h1 style="margin: 0; font-size: 28px; position: absolute; left: 70px; text-shadow: 2px 4px 6px rgba(0, 0, 0, 0.5);">DoxiGame</h1>
      <button class="fa-sharp fa-solid fa-bars-staggered dropdown-btn" id="dropdown-btn"></button>
     </div>
     <div class="top-dropdown-ui">
       <button class="top-dropdown-btn" id="home-dropdown-btn"><div class="fa-solid fa-house" style="margin-right: 10px; position: absolute; right: 10px; "> HOME</div></button>
       <button class="top-dropdown-btn" id="games-dropdown-btn"><div class="fa-solid fa-gamepad" style="margin-right: 10px; position: absolute; right: 10px;"> GAMES</div></button>
       <button class="top-dropdown-btn" id="settings-dropdown-btn"><div class="fa-solid fa-gear" style="margin-right: 10px; position: absolute; right: 10px;"> SETTINGS</div></button>
       <button class="top-dropdown-btn" id="about-dropdown-btn"><div class="fa-solid fa-info-circle" style="margin-right: 10px; position: absolute; right: 10px;"> ABOUT</div></button>
       <button class="top-dropdown-btn" id="discord-dropdown-btn"><div class="fa-brands fa-discord" style="margin-right: 10px; position: absolute; right: 10px;"> DISCORD</div></button>
     </div>
     <!--<div class="start-page">

     </div>-->

     <div class="home-page">
      <div class="blank-space" style=" height: 60px; background-color: #00A1FF;"></div>
      <img src="asset/icon.png" alt="DoxiGame Icon" class="start-icon">
      <h1 style="font-size: 44px; margin-top: 20px; text-align: center;"> the DoxiGame</h1>
      <p class="home-page-paragraph" style="text-align: center; font-size: 20px; margin-top: 10px; font-family: serif;"></p>
      <button class="start-button" id="start-button">Get Started</button>
      
      
     </div>
     <div class="game-page">
      <div class="rak1" style="background-color: transparent; height: 150px; width: 100%; margin-top: 70px; overflow: hidden; display: flex; flex-direction: row;">
        <button class="rak1-btn" onclick="window.location.href='games/blacknumber.html'" style="border: none; cursor: crosshair;"><img src="asset/blackNumberLogo.png" style="margin-right: 1px; height: 100%; width: 150px; border-radius: 10px; border: 1px solid #0f0f00;"></button>
      </div>
     </div>
     <script src="JS/main.js"></script>
     <script src="JS/info.js"></script>
  </body>
</html>
